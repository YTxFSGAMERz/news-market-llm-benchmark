[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-market-llm-benchmark"
version = "0.1.0"
description = "Benchmarking LLM sentiment from financial news against market reactions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
